<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animathics Math Quest</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#f0f4ff;background:radial-gradient(ellipse at 70% 0,#23304d,#0c1221 50%)}main{max-width:1220px;margin:auto;padding:22px}header{padding:27px 0 22px}small{letter-spacing:.19em;font-weight:900;color:#b5edda}h1{font-size:clamp(45px,8vw,78px);letter-spacing:-.06em;line-height:1;margin:8px 0}p{color:#aab9d2;line-height:1.5}.stats{display:flex;gap:22px;flex-wrap:wrap;margin:21px 0}.stats b{font-size:23px;color:#b5edda}.stats span{color:#aab9d2;font-size:13px}nav{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 24px}input,select{background:#142039;color:white;border:1px solid #44516d;border-radius:12px;padding:12px;font:inherit}input{flex:1;min-width:160px}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px}article{border:1px solid #36435c;background:#142036;border-radius:19px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}article:hover{transform:translateY(-3px);border-color:var(--accent)}.art{height:125px;display:grid;place-items:center;font-size:60px;position:relative;background:radial-gradient(ellipse at 50% 80%,color-mix(in srgb,var(--accent),#182339 45%),#142036 85%)}.art:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,transparent 0 25px,#ffffff09 26px 27px);pointer-events:none}.body{padding:15px;flex:1;display:flex;flex-direction:column}.meta{color:#b5c5dd;font-size:11px;font-weight:700}h2{font-size:21px;line-height:1.15;margin:7px 0}.topic{font-size:13px;color:var(--accent);font-weight:800}.body p{font-size:13px;flex:1}.play{display:block;text-align:center;text-decoration:none;color:#142036;background:var(--accent);font-weight:900;border-radius:11px;padding:11px;margin-top:auto}footer{margin:26px 0;color:#aab9d2;font-size:12px}#count{align-self:center;color:#b5edda;font-weight:800}</style></head><body><main><header><small>ANIMATHICS STUDIO · MATHEMATICS ARCADE</small><h1>Math Quest<span style="color:#9ae8ce">.</span></h1><p>Pilih dunia, taklukkan tantangan, gunakan matematika. Semua permainan, termasuk eksperimen lama, tersedia dalam katalog ini.</p><div class="stats"><span><b id="total"></b> game</span><span><b id="rounds"></b> level terdaftar</span></div></header><nav><input id="search" placeholder="Cari game, materi, genre…" aria-label="Cari"><select id="grade" aria-label="Jenjang"><option value="">Semua jenjang</option><option>SMP</option><option>SMA</option></select><select id="sort" aria-label="Urutan"><option value="">Terbaru dahulu</option><option value="az">A–Z</option></select><span id="count"></span></nav><section id="games"></section><footer>v0.5.0 · Game baru masih prototipe; browser modern dan internet untuk Three.js diperlukan.</footer></main><script>const catalog=[{"id":"legendary-blacksmith","title":"Legendary Blacksmith","topic":"Rasio dan perbandingan","level":"SMP","rounds":3,"genre":"Action crafting","symbol":"⚒","color":"#ffad6d","description":"Berburu bijih, hindari drone penjaga, lalu tempa pedang dengan komposisi logam dan timing palu yang tepat."},{"id":"castle-siege","title":"Castle Siege","topic":"Fungsi kuadrat","level":"SMA","rounds":3,"genre":"Physics artillery","symbol":"🏰","color":"#ffce80","description":"Kendalikan ketapel, atur kecepatan vertikal, dan bidik benteng dengan lintasan parabola."},{"id":"harvest-kingdom","title":"Harvest Kingdom","topic":"Program linear","level":"SMA","rounds":3,"genre":"Farm strategy","symbol":"🌾","color":"#9ce8a4","description":"Tanam dan panen kebun sambil mengoptimalkan keuntungan dengan batas air dan lahan."},{"id":"potion-master","title":"Potion Master","topic":"Pecahan dan persentase","level":"SMP/SMA","rounds":3,"genre":"Live mixing","symbol":"⚗","color":"#e5a2ff","description":"Operasikan pompa ramuan, kontrol volume dan konsentrasi, lalu kirim obat."},{"id":"pirate-expedition","title":"Pirate Expedition","topic":"Trigonometri","level":"SMA","rounds":3,"genre":"Sailing adventure","symbol":"⛵","color":"#8fd9ff","description":"Kemudikan kapal secara langsung, baca kompas, hindari karang, dan temukan harta tersembunyi."},{"id":"math-fortress","title":"Math Fortress","topic":"Lingkaran dan optimasi","level":"SMP/SMA","rounds":3,"genre":"Tower defense","symbol":"🛡","color":"#f9d77e","description":"Bangun menara dengan radius dan anggaran terbatas, lalu pertahankan benteng dari gelombang monster."},{"id":"bazar-alkimia","title":"Bazar Alkimia SPLDV","topic":"SPLDV","level":"SMP/SMA","rounds":4,"genre":"Action crystal hunter · Referensi","symbol":"💎","color":"#df9aff","description":"Kumpulkan kristal Surya dan Bulan, hindari golem, dan racik komposisi SPLDV di kuali."},{"id":"crystal-mines","title":"Crystal Mines","topic":"Faktorisasi prima","level":"SMP","rounds":4,"description":"Jelajahi gua, tambang kristal prima, dan pecahkan inti batu menjadi faktor-faktornya.","genre":"Mining adventure","color":"#c594ff","symbol":"⛏"},{"id":"velocity-rush","title":"Velocity Rush","topic":"Fungsi linear","level":"SMP/SMA","rounds":4,"description":"Atur kecepatan kendaraan untuk menyusul pembalap di garis pertemuan.","genre":"Arcade racing","color":"#ffb44a","symbol":"🏁"},{"id":"bridge-master","title":"Bridge Master","topic":"Teorema Pythagoras","level":"SMP","rounds":4,"description":"Ukur jurang diagonal, pilih balok, pasang jembatan, lalu seberangi.","genre":"Construction adventure","color":"#94e3a5","symbol":"🌉"},{"id":"cosmic-navigator","title":"Cosmic Navigator","topic":"Vektor","level":"SMA","rounds":4,"description":"Atur komponen dorongan pesawat dan navigasikan rute di antara asteroid.","genre":"Space navigation","color":"#72dfff","symbol":"🚀"},{"id":"number-factory","title":"Number Factory","topic":"Barisan dan deret","level":"SMP/SMA","rounds":4,"description":"Kalibrasi mesin, produksi paket energi berurutan, dan penuhi pesanan.","genre":"Factory simulation","color":"#ffd86c","symbol":"⚙"},{"id":"deep-blue","title":"Deep Blue","topic":"Persamaan linear","level":"SMP/SMA","rounds":4,"description":"Kendalikan ballast kapal selam untuk mencapai kedalaman harta karun.","genre":"Underwater exploration","color":"#48e6de","symbol":"🐠"},{"id":"matrix-blox","title":"Arena Matriks Blox","topic":"Transformasi geometri","level":"SMP/SMA","description":"Injak bayangan tiga kristal setelah transformasi.","rounds":4,"genre":"Spatial puzzle","color":"#8bb5ff","symbol":"◇"},{"id":"circle-meteor","title":"Lingkaran Meteor","topic":"Persamaan lingkaran","level":"SMA","description":"Berlari ke dalam perisai sebelum meteor datang.","rounds":5,"genre":"Boss battle","color":"#ff805d","symbol":"🐉"},{"id":"skybound","title":"Skybound Transform Quest","topic":"Transformasi geometri","level":"SMP/SMA","rounds":12,"description":"Jelajahi pulau awan, melompat, dash, dan kumpulkan dua belas runa.","genre":"Adventure platformer","color":"#c2b5ff","symbol":"☁"},{"id":"intersection-lock","title":"Portal Interseksi","topic":"SPLDV","level":"SMP/SMA","description":"Dua kode linear mengunci portal. Temukan titik perpotongannya di arena.","rounds":4,"genre":"Arena experiment","symbol":"◆","color":"#b2bcdf"},{"id":"vector-strike","title":"Vector Strike","topic":"Vektor","level":"SMA","description":"Kunci jangkar senjata dengan berjalan ke ujung resultan vektor.","rounds":4,"genre":"Arena experiment","symbol":"◆","color":"#b2bcdf"},{"id":"laser-line","title":"Laser Line","topic":"Persamaan garis","level":"SMP","description":"Bangun jalur laser dengan mengaktifkan semua ubin pada garis.","rounds":4,"genre":"Arena experiment","symbol":"◆","color":"#b2bcdf"},{"id":"parabola-reactor","title":"Parabola Reactor","topic":"Fungsi kuadrat","level":"SMA","description":"Pulihkan kabel reaktor dengan membangun lintasan parabola.","rounds":4,"genre":"Arena experiment","symbol":"◆","color":"#b2bcdf"},{"id":"distance-sensors","title":"Distance Sensors","topic":"Jarak dua titik","level":"SMP/SMA","description":"Pasang sensor pada semua titik yang berjarak tepat dari kristal pusat.","rounds":4,"genre":"Arena experiment","symbol":"◆","color":"#b2bcdf"},{"id":"pythagoras-bridge","title":"Pythagoras Bridge","topic":"Teorema Pythagoras","level":"SMP","description":"Cari semua titik jangkar jembatan yang memenuhi panjang kabel.","rounds":4,"genre":"Arena experiment","symbol":"◆","color":"#b2bcdf"},{"id":"transform-combo","title":"Transform Combo","topic":"Komposisi transformasi","level":"SMA","description":"Kristal menjalani dua transformasi berurutan. Kunci ketiga bayangannya.","rounds":4,"genre":"Arena experiment","symbol":"◆","color":"#b2bcdf"},{"id":"optimization-vault","title":"Optimization Vault","topic":"Optimasi linear bilangan bulat","level":"SMA","description":"Pilih muatan paling bernilai tanpa melampaui kapasitas reaktor.","rounds":4,"genre":"Arena experiment","symbol":"◆","color":"#b2bcdf"},{"id":"trig-beacon","title":"Trigonometric Beacon","topic":"Trigonometri","level":"SMA","description":"Arahkan rangkaian antena pada sudut yang benar.","rounds":4,"genre":"Arena experiment","symbol":"◆","color":"#b2bcdf"},{"id":"inequality-raid","title":"Inequality Raid","topic":"Pertidaksamaan linear","level":"SMP/SMA","description":"Berdiri di ubin yang memenuhi pertidaksamaan linear.","rounds":5,"genre":"Arena experiment","symbol":"◆","color":"#b2bcdf"},{"id":"feasible-zone","title":"Feasible Zone","topic":"Sistem pertidaksamaan","level":"SMA","description":"Selamatkan diri di ubin yang memenuhi kedua syarat sekaligus.","rounds":5,"genre":"Arena experiment","symbol":"◆","color":"#b2bcdf"},{"id":"quadratic-raid","title":"Quadratic Raid","topic":"Pertidaksamaan kuadrat","level":"SMA","description":"Hindari serangan dengan memilih ubin di atas atau di bawah parabola sesuai syarat.","rounds":5,"genre":"Arena experiment","symbol":"◆","color":"#b2bcdf"}];const $=id=>document.getElementById(id);$('total').textContent=catalog.length;$('rounds').textContent=catalog.reduce((s,g)=>s+(g.rounds||0),0);function render(){let q=$('search').value.toLowerCase().trim(),l=$('grade').value;let a=catalog.filter(g=>(!l||g.level.includes(l))&&[g.title,g.topic,g.genre,g.description].join(' ').toLowerCase().includes(q));if($('sort').value==='az')a.sort((a,b)=>a.title.localeCompare(b.title));$('count').textContent=a.length+' game';$('games').innerHTML=a.map(g=>'<article style="--accent:'+g.color+'"><div class="art">'+g.symbol+'</div><div class="body"><div class="meta">'+g.genre+' · '+g.level+' · '+g.rounds+' level</div><h2>'+g.title+'</h2><div class="topic">'+g.topic+'</div><p>'+g.description+'</p><a class="play" href="games/'+g.id+'/index.html">Mainkan →</a></div></article>').join('')||'<p>Tidak ada hasil.</p>'}for(let id of ['search','grade','sort'])$(id).addEventListener(id==='search'?'input':'change',render);render()</script></body></html>
