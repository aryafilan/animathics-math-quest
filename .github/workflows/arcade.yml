name: Arcade checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in arcade/*.js; do node --input-type=module --check < "$f"; done
      - run: node scripts/test-arcade.mjs
