name: Validate Aegis of Orbia
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --input-type=module --check < games/aegis-orbia/aegis.js
      - run: node scripts/test-aegis.mjs
